<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 0 560 180" width="520" height="180" style="display:block;margin:auto;">
  <defs>
    <linearGradient id="mintG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3ED4C4"/>
      <stop offset="100%" style="stop-color:#18AFA0"/>
    </linearGradient>
    <linearGradient id="coralG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F9907F"/>
      <stop offset="100%" style="stop-color:#E05F4E"/>
    </linearGradient>
    <linearGradient id="bellyFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF0ED"/>
      <stop offset="100%" style="stop-color:#FFDAD4"/>
    </linearGradient>
    <filter id="bs">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#18AFA0" flood-opacity="0.18"/>
    </filter>
    <filter id="cs">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#E05F4E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- ══════════════════════════
       BELLY ICON — left side
       Round bump, minimal, clean
       ══════════════════════════ -->

  <!-- Outer belly shape — coral -->
  <path d="
    M 30 160
    L 30 60
    C 30 30, 50 20, 75 20
    C 100 20, 120 30, 120 60
    C 140 65, 155 85, 155 110
    C 155 140, 135 165, 105 168
    L 30 160 Z
  " fill="url(#coralG)" filter="url(#cs)"/>

  <!-- Inner belly — soft fill -->
  <path d="
    M 45 152
    L 45 68
    C 45 46, 58 36, 75 36
    C 92 36, 105 46, 105 68
    C 120 73, 132 90, 132 110
    C 132 134, 118 152, 100 154
    L 45 152 Z
  " fill="url(#bellyFill)"/>

  <!-- Belly gloss -->
  <ellipse cx="90" cy="78" rx="16" ry="22"
    fill="rgba(255,255,255,0.35)" transform="rotate(-8,90,78)"/>

  <!-- Navel -->
  <ellipse cx="104" cy="118" rx="5" ry="4" fill="rgba(224,95,78,0.2)"/>
  <ellipse cx="104" cy="118" rx="2.5" ry="2" fill="rgba(224,95,78,0.45)"/>

  <!-- Heart inside belly -->
  <g transform="translate(100, 100)">
    <path d="M0,8 C-1,5 -12,-2 -12,-9 C-12,-16 -5,-18 0,-12 C5,-18 12,-16 12,-9 C12,-2 1,5 0,8 Z"
      fill="white" opacity="0.85"/>
  </g>

  <!-- Mint top arc — top of belly/chest area -->
  <path d="
    M 30 90
    C 30 70, 40 50, 75 48
    C 110 50, 120 70, 120 90
    L 120 75
    C 120 48, 100 30, 75 30
    C 50 30, 30 48, 30 75 Z
  " fill="url(#mintG)" filter="url(#bs)" opacity="0.9"/>

  <!-- Sparkle left -->
  <g transform="translate(16, 100)">
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#3ED4C4" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#3ED4C4" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <!-- Sparkle right -->
  <g transform="translate(168, 78)">
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#F9907F" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#F9907F" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <circle cx="168" cy="130" r="3" fill="#F9907F" opacity="0.35"/>
  <circle cx="14" cy="58" r="3" fill="#3ED4C4" opacity="0.35"/>

  <!-- ══════════════════════════
       WORDMARK — right side
       Vertically centered with icon
       ══════════════════════════ -->

  <!-- "Belly" — mint bold -->
  <text x="200" y="90"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="72"
    font-weight="bold"
    fill="url(#mintG)">Belly</text>

  <!-- "Balance" — coral italic, same x, next line -->
  <text x="200" y="152"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="46"
    font-weight="normal"
    font-style="italic"
    fill="url(#coralG)"
    letter-spacing="2">Balance</text>

  <!-- Thin vertical divider between icon and text -->
  <line x1="180" y1="17" x2="180" y2="160"
    stroke="#e0e0e0" stroke-width="1" stroke-linecap="round"/>

  <!-- Heart accent small -->
  <g transform="translate(400, 84)">
    <path d="M0,6 C0,6 -7,-1 -7,-5 C-7,-9 -3,-10 0,-7 C3,-10 7,-9 7,-5 C7,-1 0,6 0,6 Z"
      fill="#F9907F" opacity="0.7"/>
  </g>

</svg>
